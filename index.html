        <style>
        :root {
            --mehri-mint: #A7F3D0;
            --mehri-slate: #1E293B;
            --mehri-white: #FFFFFF;
            --ease-out-quart: cubic-bezier(0.17, 0.55, 0.55, 1);
            --background: hsl(0, 0%, 100%);
            --foreground: hsl(0, 0%, 0%);
            --skeleton: hsl(0, 0%, 90%);
            --border: hsl(220, 20%, 90%);
            --btn-border: hsl(214deg, 31.8%, 91.4%);
            --input: hsl(220, 20%, 90%);
            --radius: 0.5rem;
        }

        .dark {
            --background: hsl(222, 94%, 5%);
            --foreground: hsl(0, 0%, 100%);
            --skeleton: hsl(218, 36%, 16%);
            --border: hsl(220, 20%, 90%);
            --btn-border: hsl(217deg, 32.6%, 17.5%);
            --input: hsl(219, 63%, 16%);
            --radius: 0.5rem;
        }
        body {
            background-color: var(--mehri-white);
            color: var(--mehri-slate);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        #map {
            height: 400px;
            width: 100%;
            border-radius: 24px;
            z-index: 10;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @layer base {
          body {
            @apply bg-background text-foreground;
          }
        }

        @layer components {
          .g-button {
            @apply rounded-[var(--radius)] border;
            border-color: var(--btn-border);
          }
        }

        /* --- TIPTAP EDITOR STYLES --- */
        .ProseMirror {
            outline: none;
            min-height: 50vh;
            display: block;
            width: 100%;
            padding-bottom: 200px;

        .ProseMirror p.is-editor-empty:first-child::before {

            float: left;
            color: #4b5563;
            pointer-events: none;
            height: 0;
